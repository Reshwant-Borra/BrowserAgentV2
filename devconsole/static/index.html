<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComputerAgent Dev Console</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c2330; --muted: #6a7384; --line: #dde1e8;
    --ok-bg: #e3f5e8; --ok: #146c2e; --bad-bg: #fde4e4; --bad: #a3161b;
    --warn-bg: #fff2d6; --warn: #8a5a00; --info-bg: #e5edfb; --info: #1f4ea3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --ink: #e4e8ef; --muted: #939cad; --line: #2c3340;
      --ok-bg: #133823; --ok: #7fe0a0; --bad-bg: #451719; --bad: #ff9a9a;
      --warn-bg: #3d2f10; --warn: #ffd27a; --info-bg: #182a4a; --info: #9cbcff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card);
           display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  header .note { color: var(--muted); font-size: 12px; }
  nav button, .controls button { font: inherit; padding: 5px 10px; border: 1px solid var(--line);
           background: var(--bg); color: var(--ink); border-radius: 6px; cursor: pointer; }
  nav button[aria-pressed="true"] { background: var(--info-bg); color: var(--info); border-color: var(--info); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; }
  .controls label { color: var(--muted); font-size: 12px; display: flex; gap: 4px; align-items: center; }
  select, input { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px;
                  background: var(--card); color: var(--ink); max-width: 100%; }
  main { padding: 0 16px 24px; display: grid; gap: 12px;
         grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
          overflow-x: auto; }
  .card.wide { grid-column: 1 / -1; }
  .card.wide > table > tbody > tr > td > table { max-width: 720px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  td.k { color: var(--muted); white-space: nowrap; width: 1%; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-weight: 600; font-size: 12px;
           font-family: ui-monospace, Menlo, monospace; }
  .ok { background: var(--ok-bg); color: var(--ok); }
  .bad { background: var(--bad-bg); color: var(--bad); }
  .warn { background: var(--warn-bg); color: var(--warn); }
  .info { background: var(--info-bg); color: var(--info); }
  #verdict { font-size: 15px; }
  ol.timeline { margin: 0; padding-left: 22px; }
  ol.timeline li { padding: 3px 0; border-bottom: 1px dashed var(--line); }
  ol.timeline .src { color: var(--muted); font-size: 11px; }
  .err { color: var(--bad); padding: 16px; }
</style>
</head>
<body>
<header>
  <h1>ComputerAgent Developer Console v0</h1>
  <nav id="tabs"></nav>
  <span class="note">Observational only: every value below was computed by the backend; this page renders it.</span>
</header>
<div class="controls" id="controls"></div>
<main id="out"></main>
<script>
"use strict";
// Presentation-only tone map: colors a backend-provided value; never decides one.
const TONE = {
  ok: ["CORRECT_TARGET_DISPATCH", "RESOLVED", "VERIFIED_SUCCESS", "FRESHNESS_PASSED", "DISPATCHED",
       "COMPLETED", "COMMITTED", "OUTCOME_RECONCILED", "TARGET_RESOLVED", "ACTION_COMMITTED", "STEP_COMPLETED", "TASK_COMPLETED", "PASS", "correct", "TRUE"],
  bad: ["WRONG_TARGET_DISPATCH", "STALE_TARGET_DISPATCH", "FALSE_SUCCESS", "UNEXPECTED_SIDE_EFFECT",
        "VERIFIED_FAILURE", "FAIL", "CRASH", "DUPLICATE_EFFECT", "UNSAFE_RETRY", "POLICY_BLOCKED", "FALSE", "FALSE_FAILURE"],
  warn: ["ABSTAINED", "AMBIGUOUS", "ABSENT", "STALE", "UNSUPPORTED", "INCONCLUSIVE", "PARTIAL_SUCCESS",
         "NEEDS_REVIEW", "OUTCOME_UNKNOWN", "FRESHNESS_FAILED", "TARGET_REJECTED", "BLOCKED", "RESTART", "RECOVERY_STARTED", "STEP_BLOCKED", "ACTION_FAILED", "UNKNOWN", "ACTION_ABANDONED"],
};
const toneOf = v => Object.keys(TONE).find(t => TONE[t].includes(String(v))) || null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const val = v => {
  if (v === null || v === undefined) return '<span class="mono" style="opacity:.6">—</span>';
  if (typeof v === "boolean") return `<span class="badge ${v ? "info" : ""}">${v}</span>`;
  const t = toneOf(v);
  if (t) return `<span class="badge ${t}">${esc(v)}</span>`;
  if (typeof v === "object") return render(v);
  return `<span class="mono">${esc(v)}</span>`;
};
function render(d) {
  if (Array.isArray(d)) {
    if (!d.length) return val(null);
    if (d.every(x => x && typeof x === "object" && !Array.isArray(x))) {
      const cols = [...new Set(d.flatMap(Object.keys))];
      return `<table><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr>${
        d.map(r => `<tr>${cols.map(c => `<td>${val(r[c])}</td>`).join("")}</tr>`).join("")}</table>`;
    }
    return d.map(val).join(" ");
  }
  if (d && typeof d === "object")
    return `<table>${Object.entries(d).map(([k, v]) => `<tr><td class="k">${esc(k)}</td><td>${val(v)}</td></tr>`).join("")}</table>`;
  return val(d);
}

const TABS = {
  m1: {label: "M1 · Grounding (Fixture A)", params: [["scenario", "m1"], ["seed", 0]]},
  m2: {label: "M2 · Verification (Fixture B)", params: [["case", "m2"], ["seed", 0]]},
  m3: {label: "M3 · Lifecycle (Fixture C)", params: [["scenario", "m3.combined"], ["seed", 0]]},
};
let catalog = {}, tab = "m1";

function pick(path) { return path.split(".").reduce((o, k) => (o || {})[k], catalog); }

function buildControls() {
  const c = document.getElementById("controls");
  c.innerHTML = "";
  for (const [name, src] of TABS[tab].params) {
    const opts = typeof src === "string" ? pick(src) : null;
    const label = document.createElement("label");
    label.textContent = name;
    const el = document.createElement(opts ? "select" : "input");
    el.id = "p-" + name;
    if (opts) opts.forEach(o => el.add(new Option(o, o)));
    else { el.type = "number"; el.value = src; el.style.width = "7em"; }
    label.appendChild(el);
    c.appendChild(label);
  }
  const add = (text, fn) => { const b = document.createElement("button"); b.textContent = text; b.onclick = fn; c.appendChild(b); };
  add("Run", run);
  add("Next scenario", () => { const s = c.querySelector("select"); if (s) s.selectedIndex = (s.selectedIndex + 1) % s.options.length; run(); });
  add("Random seed", () => { document.getElementById("p-seed").value = Math.floor(Math.random() * 1e6); run(); });
}

async function run() {
  const qs = new URLSearchParams(TABS[tab].params.map(([n]) => [n, document.getElementById("p-" + n).value]));
  const out = document.getElementById("out");
  const r = await fetch(`/api/${tab}?${qs}`);
  const d = await r.json();
  if (!r.ok) { out.innerHTML = `<div class="err">${esc(d.error)}</div>`; return; }
  const {kind, timeline, ...sections} = d;
  let html = "";
  for (const [title, data] of Object.entries(sections))
    html += `<section class="card${Array.isArray(data) || ["candidates", "lifecycle"].includes(title) ? " wide" : ""}"><h2>${esc(title.replaceAll("_", " "))}</h2>${render(data)}</section>`;
  html += `<section class="card wide"><h2>timeline (ordered)</h2><ol class="timeline">${
    (timeline || []).map(e => `<li><span class="badge ${toneOf(e.event) || "info"}">${esc(e.event)}</span> <span class="mono">${esc(e.detail || "")}</span>${
      e.source ? ` <span class="src">[${esc(e.source)}]</span>` : ""}</li>`).join("")}</ol></section>`;
  out.innerHTML = html;
}

async function init() {
  catalog = await (await fetch("/api/scenarios")).json();
  const nav = document.getElementById("tabs");
  for (const [key, t] of Object.entries(TABS)) {
    if (!catalog[key]) continue;  // tab appears only once its backend exists
    const b = document.createElement("button");
    b.textContent = t.label;
    b.onclick = () => { tab = key; [...nav.children].forEach(x => x.setAttribute("aria-pressed", x === b)); buildControls(); run(); };
    b.setAttribute("aria-pressed", key === tab);
    nav.appendChild(b);
  }
  buildControls();
  run();
}
init();
</script>
</body>
</html>
